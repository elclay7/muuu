<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración | Horarios de Lactancia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-panel admin-panel">
    <div class="brand"><span class="brand-dot"></span><h1>Administración</h1></div>
    <p class="auth-kicker">Horarios de Lactancia</p>
    <section id="setup-section">
      <h2>Crear administrador</h2>
      <p class="auth-note">Esta cuenta será la única autorizada para administrar los usuarios.</p>
      <form id="setup-form" class="auth-form">
        <label>Usuario<input name="username" minlength="3" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <label>Repetir contraseña<input name="confirmation" type="password" minlength="8" autocomplete="new-password" required></label>
        <p id="setup-error" class="form-error" role="alert"></p>
        <button class="primary-btn" type="submit">Crear administrador</button>
      </form>
    </section>
    <section id="admin-login-section" hidden>
      <h2>Acceso administrador</h2>
      <p class="auth-note">Ingresa con tu cuenta para administrar los usuarios.</p>
      <form id="admin-login-form" class="auth-form">
        <label>Usuario<input name="username" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="admin-login-error" class="form-error" role="alert"></p>
        <button class="primary-btn" type="submit">Ingresar</button>
      </form>
    </section>
    <section id="settings-section" hidden>
      <h2>Usuarios</h2>
      <p class="auth-note">Crea el usuario compartido que utilizarán ambos padres.</p>
      <form id="user-form" class="settings-form">
        <label>Usuario<input name="username" minlength="3" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
        <p id="user-message" class="form-message" role="status"></p>
        <button class="primary-btn" type="submit">Crear usuario familiar</button>
      </form>
      <div id="users-list" class="users-list" role="table" aria-label="Usuarios existentes"></div>
      <button id="logout-button" class="secondary-btn" type="button">Cerrar sesión</button>
    </section>
    <p><a href="/">Volver a horarios</a></p>
  </main>
  <script src="admin.js"></script>
</body>
</html>
