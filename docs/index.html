<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de lactancia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Bitácora de lactancia</h1>
      </div>
      <div class="clock-block">
        <time id="clock" class="clock" aria-live="polite">--:--:--</time>
        <p id="today" class="today-date">-</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" title="Cambiar modo de color" aria-label="Cambiar modo de color">☾</button>
      <nav class="header-actions" aria-label="Cuenta">
        <a class="stats-link" href="/stats" title="Ver estadísticas" aria-label="Ver estadísticas">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M5 19V5h2v14H5Zm6 0V9h2v10h-2Zm6 0V2h2v17h-2Z" fill="currentColor"/></svg>
          <span>Estadísticas</span>
        </a>
        <span id="logged-user" class="logged-user"></span>
        <button id="btn-logout" type="button">Salir</button>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <div class="day-toolbar">
      <button id="previous-day" class="day-nav" type="button" title="Día anterior" aria-label="Día anterior">←</button>
      <time id="selected-date" class="selected-date"></time>
      <button id="next-day" class="day-nav" type="button" title="Día siguiente" aria-label="Día siguiente">→</button>
    </div>
    <div class="schedules-grid">

      <section class="schedule-column" aria-labelledby="titulo-bebe">
        <div class="column-heading">
          <span class="column-icon" aria-hidden="true">🍼</span>
          <h2 id="titulo-bebe">Tomas del Bebé</h2>
          <span id="interval-tomas" class="interval-pill" title="Promedio entre tomas">cada 3 h</span>
        </div>
        <div id="lista-tomas" class="card-list"></div>
        <button id="add-toma" class="add-record-btn" type="button">+ Agregar registro</button>
      </section>

      <section class="schedule-column" aria-labelledby="titulo-mama">
        <div class="column-heading">
          <span class="column-icon" aria-hidden="true">🤱</span>
          <h2 id="titulo-mama">Extracciones Mamá</h2>
          <span id="interval-extracciones" class="interval-pill" title="Promedio entre extracciones">cada 2 h</span>
        </div>
        <div id="lista-extracciones" class="card-list"></div>
        <button id="add-extraccion" class="add-record-btn" type="button">+ Agregar registro</button>
      </section>

    </div>
    <section class="daily-summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Resumen diario</h2>
      <div class="summary-grid">
        <label>Toma indicada por pediatra<input id="pediatric-ml" type="number" min="10" max="200" step="5" value="80"></label>
        <div><span>Objetivo diario</span><strong id="daily-goal">640 ml</strong></div>
        <div><span>Extraído</span><strong id="extracted-total">0 ml</strong></div>
        <div><span>Faltante</span><strong id="remaining-total">640 ml</strong></div>
      </div>
      <div class="summary-actions">
        <a class="primary-btn chart-btn" href="/stats" title="Ver gráfico de extracciones" aria-label="Ver gráfico de extracciones">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 19V5h2v14H5Zm6 0V9h2v10h-2Zm6 0V2h2v17h-2Z" fill="currentColor"/></svg>
          <span>Ver gráfico de extracciones</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-actions">
      <button id="btn-reset" class="reset-btn" type="button">Borrar registros del día y dejar solo el de las 00:00</button>
    </div>
  </footer>

  <!-- Plantilla de tarjeta (se clona por JS) -->
  <template id="tpl-card">
    <article class="event-card">
      <div class="card-fields">
        <input type="time" class="time-input" step="60" aria-label="Hora">
        <select class="type-select" aria-label="Tipo"></select>
        <select class="content-select" aria-label="Contenido"></select>
        <select class="volume-select" aria-label="Volumen en mililitros"></select>
        <button class="delete-record" type="button" title="Eliminar registro" aria-label="Eliminar registro">×</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
