<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horarios de Lactancia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Horarios de Lactancia</h1>
      </div>
      <div class="clock-block">
        <time id="clock" class="clock" aria-live="polite">--:--:--</time>
        <p id="today" class="today-date">-</p>
      </div>
      <nav class="header-actions" aria-label="Cuenta">
        <span id="logged-user" class="logged-user"></span>
        <button id="btn-logout" type="button">Salir</button>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <div class="schedules-grid">

      <section class="schedule-column" aria-labelledby="titulo-bebe">
        <div class="column-heading">
          <span class="column-icon" aria-hidden="true">🍼</span>
          <h2 id="titulo-bebe">Tomas del Bebé</h2>
          <button id="interval-tomas" class="interval-pill" type="button">cada 3 h</button>
          <div id="interval-edit-tomas" class="interval-edit" hidden>
            <input class="interval-input" type="number" min="1" max="24" aria-label="Intervalo de tomas en horas">
            <button class="interval-save" type="button" title="Guardar intervalo">Guardar</button>
            <button class="interval-cancel" type="button" title="Cancelar" aria-label="Cancelar">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M18.3 5.71 12 12l6.3 6.29-1.42 1.42L10.59 13.4 4.3 19.7 2.88 18.3 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <div id="lista-tomas" class="card-list"></div>
      </section>

      <section class="schedule-column" aria-labelledby="titulo-mama">
        <div class="column-heading">
          <span class="column-icon" aria-hidden="true">🤱</span>
          <h2 id="titulo-mama">Extracciones Mamá</h2>
          <button id="interval-extracciones" class="interval-pill" type="button">cada 2 h</button>
          <div id="interval-edit-extracciones" class="interval-edit" hidden>
            <input class="interval-input" type="number" min="1" max="24" aria-label="Intervalo de extracciones en horas">
            <button class="interval-save" type="button" title="Guardar intervalo">Guardar</button>
            <button class="interval-cancel" type="button" title="Cancelar" aria-label="Cancelar">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M18.3 5.71 12 12l6.3 6.29-1.42 1.42L10.59 13.4 4.3 19.7 2.88 18.3 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <div id="lista-extracciones" class="card-list"></div>
      </section>

    </div>
  </main>

  <footer class="app-footer">
    <button id="btn-reset" class="reset-btn" type="button">Restablecer horarios por defecto</button>
  </footer>

  <!-- Plantilla de tarjeta (se clona por JS) -->
  <template id="tpl-card">
    <article class="event-card">
      <div class="card-view">
        <div class="card-label"></div>
        <button class="card-time" type="button"></button>
        <span class="next-tag">• Siguiente</span>
      </div>
      <div class="card-edit">
        <input type="time" class="time-input" step="60">
        <div class="edit-actions">
          <button class="edit-btn edit-cascade" type="button" title="Guardar y reajustar toda la lista">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/></svg>
            <span>Cascada</span>
          </button>
          <button class="edit-btn edit-single" type="button" title="Guardar solo este horario">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z" fill="currentColor"/></svg>
            <span>Individual</span>
          </button>
          <button class="edit-btn edit-cancel" type="button" title="Cancelar">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M18.3 5.71 12 12l6.3 6.29-1.42 1.42L10.59 13.4 4.3 19.7 2.88 18.3 9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
