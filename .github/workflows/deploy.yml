name: Deploy web

on:
  push:
    branches:
      - main

concurrency:
  group: alimentacion-emma-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust deployment host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Replace HTML and restart through Portainer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: /storage/webservices/alimentacion-emma
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          rm -rf "$DEPLOY_PATH/deploy"
          rm -f "$DEPLOY_PATH/Dockerfile" "$DEPLOY_PATH/Dockerfile.nginx" "$DEPLOY_PATH/nginx.conf" "$DEPLOY_PATH/server.py" "$DEPLOY_PATH/docker-compose.yml"
          mkdir -p "$DEPLOY_PATH/html" "$DEPLOY_PATH/db"
          REMOTE

          rsync -az --delete --chmod=F644,D755 -e "ssh -p $SSH_PORT" docs/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/html/"

          ssh -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker rm -f ws-app ws-db 2>/dev/null || true"

          curl --fail --show-error --silent --retry 3 --retry-delay 5 \
            -X POST "$PORTAINER_WEBHOOK_URL"