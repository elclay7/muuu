services:
  alimentacion-emma:
    image: nginx:alpine
    container_name: alimentacion-emma
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - /storage/webservices/alimentacion-emma/html:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s